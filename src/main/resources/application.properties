spring.application.name=cognify-backend

# Server Configuration
server.port=${PORT:8080}

# PostgreSQL Configuration
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Neo4j Configuration
neo4j.uri=${NEO4J_URI:neo4j+s://0ecd9504.databases.neo4j.io}
neo4j.username=${NEO4J_USERNAME:neo4j}
neo4j.password=${NEO4J_PASSWORD}

# JWT Configuration
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Azure Blob Storage
azure.storage.blob.connection-string=${AZURE_STORAGE_CONNECTION_STRING}
azure.storage.blob.container-name=${AZURE_STORAGE_CONTAINER_NAME:cognify}

# Azure AI Search
azure.search.endpoint=${AZURE_SEARCH_ENDPOINT}
azure.search.api-key=${AZURE_SEARCH_API_KEY}
azure.search.index-name=${AZURE_SEARCH_INDEX_NAME:cognify-index}

# Google Gemini
gemini.api.key=${GEMINI_API_KEY}



